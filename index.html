<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        .skip { position: absolute; top: -100px; transition: top 0.2s; }
        .skip:focus, .skip:focus-visible { top: 0; background: var(--primary); color: #fff; padding: 8px 16px; z-index: 100; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        .card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-top: 24px; background: #f8fafc; }
        .hotline-group { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
        .phone-link { color: var(--primary); font-weight: bold; font-size: 1.25rem; text-decoration: none; }
        .phone-link:hover, .phone-link:focus-visible { text-decoration: underline; }
        .btn-copy { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        .btn-copy:hover { background: var(--primary-hover); }
        .btn-copy.success { background: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section class="card">
            <h2>Customer Care Hotline</h2>
            <p>Need assistance? Contact our 24/7 hotline support.</p>
            <div class="hotline-group">
                <a id="hotline-link" class="phone-link" href="tel:09606700700">09606 700 700</a>
                <button id="copy-btn" class="btn-copy" aria-label="Copy hotline number to clipboard">Copy Number</button>
            </div>
        </section>
    </main>
    <script>
        const copyBtn = document.getElementById('copy-btn');
        const hotlineLink = document.getElementById('hotline-link');
        let copyTimeout;
        if (copyBtn && hotlineLink && navigator.clipboard) {
            copyBtn.addEventListener('click', () => {
                const rawNum = hotlineLink.getAttribute('href').replace('tel:', '');
                navigator.clipboard.writeText(rawNum).then(() => {
                    clearTimeout(copyTimeout);
                    copyBtn.textContent = 'Copied!';
                    copyBtn.classList.add('success');
                    copyBtn.setAttribute('aria-label', 'Hotline number copied to clipboard');
                    copyTimeout = setTimeout(() => {
                        copyBtn.textContent = 'Copy Number';
                        copyBtn.classList.remove('success');
                        copyBtn.setAttribute('aria-label', 'Copy hotline number to clipboard');
                    }, 2000);
                }).catch(() => {});
            });
        }
    </script>
</body>
</html>
