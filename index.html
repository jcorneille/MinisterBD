<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; }
        .skip { position: absolute; top: -40px; transition: top 0.2s; }
        .skip:focus, .skip:focus-visible { top: 0; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; }
        .contact-card { display: flex; align-items: center; gap: 12px; background: #f8f9fa; padding: 16px; border-radius: 8px; border: 1px solid #e9ecef; margin-top: 20px; }
        .btn-copy { background: var(--primary); color: #fff; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        .btn-copy:hover { background: var(--primary-hover); }
        .btn-copy.success { background: var(--success); }
        .btn-copy:focus-visible, a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        .phone-link { color: var(--primary); font-weight: bold; text-decoration: none; }
        .phone-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <div class="contact-card">
            <span>Customer Hotline:</span>
            <a href="tel:09606700700" class="phone-link">09606 700 700</a>
            <button id="copyBtn" class="btn-copy" aria-label="Copy hotline number 09606 700 700">Copy</button>
        </div>
    </main>
    <script>
        const btn = document.getElementById('copyBtn');
        let timer = null;
        if (btn) {
            btn.addEventListener('click', () => {
                navigator.clipboard?.writeText('09606700700').then(() => {
                    clearTimeout(timer);
                    btn.textContent = 'Copied!';
                    btn.classList.add('success');
                    btn.setAttribute('aria-label', 'Hotline number copied');
                    timer = setTimeout(() => {
                        btn.textContent = 'Copy';
                        btn.classList.remove('success');
                        btn.setAttribute('aria-label', 'Copy hotline number 09606 700 700');
                    }, 2000);
                }).catch(() => {});
            });
        }
    </script>
</body>
</html>
