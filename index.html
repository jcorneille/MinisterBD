<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; }
        .skip { position: absolute; top: -100px; transition: top 0.2s; }
        .skip:focus, .skip:focus-visible { top: 0; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; }
        .hotline-card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; margin-top: 24px; background: #fafafa; }
        .btn-copy { padding: 6px 12px; border-radius: 4px; border: 1px solid var(--primary); background: #fff; color: var(--primary); cursor: pointer; margin-left: 8px; font-size: 0.9rem; }
        .btn-copy:hover { background: #eef5fc; }
        .btn-copy.success { background: var(--success); color: #fff; border-color: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section class="hotline-card" aria-label="Customer Support">
            <h2>Customer Support</h2>
            <p>Hotline: <a id="hotline-link" href="tel:09606700700">09606 700 700</a>
                <button id="btn-copy-hotline" class="btn-copy" type="button" aria-label="Copy hotline number">Copy</button>
            </p>
        </section>
        <script>
            const copyBtn = document.getElementById('btn-copy-hotline');
            if (copyBtn && navigator.clipboard) {
                const origText = copyBtn.textContent;
                const origAria = copyBtn.getAttribute('aria-label');
                let timer = null;
                copyBtn.addEventListener('click', async () => {
                    const phone = document.getElementById('hotline-link')?.getAttribute('href')?.replace('tel:', '') || '09606700700';
                    await navigator.clipboard.writeText(phone);
                    if (timer) clearTimeout(timer);
                    copyBtn.textContent = 'Copied!';
                    copyBtn.setAttribute('aria-label', 'Hotline number copied to clipboard');
                    copyBtn.classList.add('success');
                    timer = setTimeout(() => {
                        copyBtn.textContent = origText;
                        copyBtn.setAttribute('aria-label', origAria);
                        copyBtn.classList.remove('success');
                    }, 2000);
                });
            } else if (copyBtn && !navigator.clipboard) {
                copyBtn.style.display = 'none';
            }
        </script>
    </main>
</body>
</html>
