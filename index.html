<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .skip { position: absolute; top: -40px; transition: top 0.2s ease; }
        .skip:focus-visible { top: 0; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        .card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-top: 20px; }
        .hotline-container { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .hotline-link { font-size: 1.2rem; font-weight: bold; color: var(--primary); text-decoration: none; }
        .hotline-link:hover { color: var(--primary-hover); text-decoration: underline; }
        .btn { background-color: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; transition: background-color 0.2s; }
        .btn:hover { background-color: var(--primary-hover); }
        .btn.success, .btn.success:hover { background-color: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section class="card" aria-labelledby="hotline-title">
            <h2 id="hotline-title" style="margin-top:0;">Customer Hotline</h2>
            <p>For support, please call our official hotline:</p>
            <div class="hotline-container">
                <a id="hotline-link" href="tel:09606700700" aria-label="Call hotline 0 9 6 0 6 7 0 0 7 0 0" class="hotline-link">09606 700 700</a>
                <button id="copy-btn" aria-label="Copy hotline number to clipboard" class="btn">Copy</button>
            </div>
        </section>
    </main>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const btn = document.getElementById("copy-btn"), link = document.getElementById("hotline-link");
            if (!btn || !link) return;
            if (!navigator || !navigator.clipboard) { btn.style.display = "none"; return; }
            const origText = btn.textContent, origAria = btn.getAttribute("aria-label") || "";
            let tid = null;
            btn.addEventListener("click", () => {
                navigator.clipboard.writeText(link.getAttribute("href").replace("tel:", "")).then(() => {
                    if (tid) clearTimeout(tid);
                    btn.textContent = "Copied!"; btn.setAttribute("aria-label", "Hotline number copied successfully"); btn.classList.add("success");
                    tid = setTimeout(() => { btn.textContent = origText; btn.setAttribute("aria-label", origAria); btn.classList.remove("success"); tid = null; }, 2000);
                }).catch(err => console.error("Copy failed", err));
            });
        });
    </script>
</body>
</html>
