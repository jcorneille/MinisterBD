<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; }
        .skip { position: absolute; top: -40px; transition: top 0.2s; }
        .skip:focus, .skip:focus-visible { top: 0; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; }
        .contact-card { display: flex; align-items: center; gap: 12px; padding: 16px; border: 1px solid #ccc; border-radius: 8px; margin-top: 20px; }
        .btn { background: var(--primary); color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        .btn.copied { background: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section aria-labelledby="support-heading">
            <h2 id="support-heading">Customer Support</h2>
            <div class="contact-card">
                <span>Hotline: <a href="tel:09606700700" id="hotline-link">09606 700 700</a></span>
                <button id="copy-btn" class="btn" aria-label="Copy hotline number to clipboard">Copy Hotline</button>
            </div>
        </section>
    </main>
    <script>
        let copyTimer = null;
        document.getElementById('copy-btn')?.addEventListener('click', function() {
            const btn = this;
            const number = document.getElementById('hotline-link').getAttribute('href').replace('tel:', '');
            if (navigator.clipboard) { navigator.clipboard.writeText(number); }
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            btn.setAttribute('aria-label', 'Hotline number copied');
            clearTimeout(copyTimer);
            copyTimer = setTimeout(() => {
                btn.textContent = 'Copy Hotline';
                btn.classList.remove('copied');
                btn.setAttribute('aria-label', 'Copy hotline number to clipboard');
            }, 2000);
        });
    </script>
</body>
</html>
