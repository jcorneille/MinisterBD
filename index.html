<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; }
        .skip { position: absolute; top: -40px; }
        .skip:focus, .skip:focus-visible { top: 0; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; }
        .contact-card { margin-top: 2rem; padding: 1.25rem; border: 1px solid #e0e0e0; border-radius: 8px; background-color: #f9f9f9; }
        .contact-card h2 { margin-top: 0; font-size: 1.25rem; }
        .tel-link { color: var(--primary); text-decoration: none; font-weight: bold; }
        .tel-link:hover, .tel-link:focus-visible { text-decoration: underline; }
        .copy-btn { margin-left: 0.5rem; padding: 0.3rem 0.6rem; background-color: var(--primary); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.875rem; }
        .copy-btn:hover, .copy-btn:focus-visible { background-color: var(--primary-hover); }
        .copy-btn.success, .copy-btn.success:hover { background-color: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section class="contact-card" aria-labelledby="contact-heading">
            <h2 id="contact-heading">Customer Support</h2>
            <p>Hotline: <a href="tel:09606700700" class="tel-link">09606 700 700</a>
                <button id="copy-btn" class="copy-btn" aria-label="Copy hotline number 09606 700 700">Copy</button>
            </p>
        </section>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('copy-btn');
            if (!btn || !navigator.clipboard) return;
            let timer;
            btn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText('09606700700');
                    clearTimeout(timer);
                    btn.textContent = 'Copied!';
                    btn.classList.add('success');
                    btn.setAttribute('aria-label', 'Hotline number copied to clipboard');
                    timer = setTimeout(() => {
                        btn.textContent = 'Copy';
                        btn.classList.remove('success');
                        btn.setAttribute('aria-label', 'Copy hotline number 09606 700 700');
                    }, 2000);
                } catch (e) {}
            });
        });
    </script>
</body>
</html>
