<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; --text: #333; }
        body { font-family: system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; color: var(--text); }
        .skip { position: absolute; top: -100px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 10px 20px; text-decoration: none; border-radius: 0 0 5px 5px; transition: top 0.2s; z-index: 100; }
        .skip:focus-visible { top: 0; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; width: 100%; box-sizing: border-box; }
        footer { background: #f8f9fa; padding: 20px; text-align: center; border-top: 1px solid #dee2e6; }
        .contact { margin-top: 40px; padding: 20px; border: 1px solid #eee; border-radius: 8px; }
        #copy-btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 500; transition: background 0.2s; }
        #copy-btn:hover { background: var(--primary-hover); }
        #copy-btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
        #copy-btn.success { background: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section class="contact">
            <h2>Contact Us</h2>
            <p>Hotline: <span id="hotline">09606 700 700</span></p>
            <button id="copy-btn" aria-label="Copy hotline number to clipboard">Copy Number</button>
        </section>
    </main>
    <footer><p>&copy; 2024 Minister Hi-Tech Park Limited</p></footer>
    <script>
        const btn = document.getElementById('copy-btn');
        btn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(document.getElementById('hotline').innerText);
                const originalText = btn.innerText, originalAria = btn.getAttribute('aria-label');
                btn.innerText = 'Copied!';
                btn.setAttribute('aria-label', 'Hotline number copied');
                btn.classList.add('success');
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.setAttribute('aria-label', originalAria);
                    btn.classList.remove('success');
                }, 2000);
            } catch (err) { console.error('Copy failed', err); }
        });
    </script>
</body>
</html>
