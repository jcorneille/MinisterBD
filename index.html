<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .skip { position: absolute; top: -40px; transition: top 0.2s; }
        .skip:focus, .skip:focus-visible { top: 0; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        footer { padding: 20px; text-align: center; border-top: 1px solid #ccc; font-size: 0.9rem; color: #555; }
        .hotline-card { margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; display: inline-flex; align-items: center; gap: 15px; }
        .hotline-link { color: var(--primary); font-weight: bold; font-size: 1.2rem; text-decoration: none; }
        .hotline-link:hover { text-decoration: underline; }
        .copy-btn { padding: 8px 12px; background-color: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.2s; }
        .copy-btn:hover { background-color: var(--primary-hover); }
        .copy-btn.success, .copy-btn.success:hover { background-color: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <div class="hotline-card">
            <a id="phone-link" class="hotline-link" href="tel:09606700700" aria-label="Call hotline 0 9 6 0 6 7 0 0 7 0 0">09606 700 700</a>
            <button id="copy-btn" class="copy-btn" aria-label="Copy hotline number">Copy Hotline</button>
        </div>
    </main>
    <footer>© 2026 Minister Hi-Tech Park Limited. All rights reserved.</footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('copy-btn'), link = document.getElementById('phone-link');
            if (!btn || !link) return;
            if (!navigator.clipboard) { btn.style.display = 'none'; return; }
            const origText = btn.textContent, origAria = btn.getAttribute('aria-label') || '', phone = link.getAttribute('href').replace('tel:', '');
            let timeoutId = null;
            btn.addEventListener('click', () => {
                navigator.clipboard.writeText(phone).then(() => {
                    if (timeoutId) clearTimeout(timeoutId);
                    btn.textContent = 'Copied!'; btn.setAttribute('aria-label', 'Phone number copied successfully'); btn.classList.add('success');
                    timeoutId = setTimeout(() => { btn.textContent = origText; btn.setAttribute('aria-label', origAria); btn.classList.remove('success'); }, 2000);
                });
            });
        });
    </script>
</body>
</html>
