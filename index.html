<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .skip { position: absolute; top: -40px; transition: top 0.2s; }
        .skip:focus, .skip:focus-visible { top: 0; background: #fff; padding: 8px; z-index: 100; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; margin-top: 24px; background: #fafafa; }
        .hotline-link { color: var(--primary); font-weight: bold; text-decoration: none; font-size: 1.1rem; }
        .hotline-link:hover, .hotline-link:focus { text-decoration: underline; }
        .btn { background: var(--primary); color: #fff; border: none; border-radius: 4px; padding: 8px 14px; cursor: pointer; font-size: 0.9rem; margin-left: 12px; transition: background-color 0.2s; }
        .btn:hover { background: var(--primary-hover); }
        .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        .btn.success, .btn.success:hover { background: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section class="card" aria-labelledby="support-heading">
            <h2 id="support-heading" style="margin-top:0;">Customer Support</h2>
            <p>Need help? Call our official hotline:</p>
            <div>
                <a href="tel:09606700700" class="hotline-link">09606 700 700</a>
                <button id="copy-btn" class="btn" aria-label="Copy hotline number to clipboard">Copy Hotline</button>
            </div>
        </section>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('copy-btn');
            if (!btn || !navigator.clipboard) return;
            const origText = btn.textContent;
            const origAria = btn.getAttribute('aria-label');
            let timeoutId = null;
            btn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText('09606 700 700');
                    if (timeoutId) clearTimeout(timeoutId);
                    btn.textContent = 'Copied!';
                    btn.setAttribute('aria-label', 'Hotline number copied to clipboard');
                    btn.classList.add('success');
                    timeoutId = setTimeout(() => {
                        btn.textContent = origText;
                        btn.setAttribute('aria-label', origAria);
                        btn.classList.remove('success');
                    }, 2000);
                } catch (e) {}
            });
        });
    </script>
</body>
</html>
