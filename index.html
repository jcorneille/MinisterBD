<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        .skip { position: absolute; top: -40px; transition: top 0.2s; }
        .skip:focus, .skip:focus-visible { top: 0; }
        main { flex: 1; max-width: 800px; margin: 40px auto; padding: 20px; }
        .hotline-card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 16px 20px; margin-top: 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .hotline-link { color: var(--primary); text-decoration: none; font-weight: bold; font-size: 1.1rem; }
        .hotline-link:hover { text-decoration: underline; }
        .btn { background: var(--primary); color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: background-color 0.2s; }
        .btn:hover { background: var(--primary-hover); }
        .btn.success { background: var(--success); }
        .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section class="hotline-card" aria-labelledby="hotline-title">
            <div>
                <h2 id="hotline-title" style="margin:0 0 4px 0;font-size:1rem;color:#495057;">Customer Support Hotline</h2>
                <a href="tel:09606700700" id="hotline-link" class="hotline-link">09606 700 700</a>
            </div>
            <button id="copy-btn" class="btn" aria-label="Copy customer support hotline number to clipboard">Copy Number</button>
        </section>
    </main>
    <script>
        const copyBtn = document.getElementById('copy-btn'), hotlineLink = document.getElementById('hotline-link');
        if (copyBtn && hotlineLink && navigator.clipboard) {
            const origText = copyBtn.textContent, origLabel = copyBtn.getAttribute('aria-label');
            let timeoutId = null;
            copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(hotlineLink.textContent.trim()).then(() => {
                    if (timeoutId) clearTimeout(timeoutId);
                    copyBtn.textContent = 'Copied!';
                    copyBtn.classList.add('success');
                    copyBtn.setAttribute('aria-label', 'Hotline number copied to clipboard');
                    timeoutId = setTimeout(() => {
                        copyBtn.textContent = origText;
                        copyBtn.classList.remove('success');
                        copyBtn.setAttribute('aria-label', origLabel);
                    }, 2000);
                }).catch(() => {});
            });
        }
    </script>
</body>
</html>
