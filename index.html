<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .skip { position: absolute; top: -40px; transition: top 0.2s; }
        .skip:focus, .skip:focus-visible { top: 0; outline: 2px solid var(--primary); }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        footer { background: #f8f9fa; padding: 15px; text-align: center; border-top: 1px solid #ddd; }
        .hotline { color: var(--primary); font-weight: bold; text-decoration: none; }
        .hotline:hover, .hotline:focus-visible { color: var(--primary-hover); text-decoration: underline; }
        .copy-btn { margin-left: 10px; padding: 4px 8px; background: var(--primary); color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .copy-btn:hover, .copy-btn:focus-visible { background: var(--primary-hover); }
        .copy-btn.success { background: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
    </main>
    <footer>
        Hotline: <a id="hotline" href="tel:09606700700" class="hotline" aria-label="Call hotline 0 9 6 0 6 7 0 0 7 0 0">09606 700 700</a>
        <button id="copy-btn" class="copy-btn" aria-label="Copy hotline number">Copy</button>
    </footer>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const btn = document.getElementById("copy-btn"), link = document.getElementById("hotline");
            if (!btn || !link || !navigator.clipboard) return (btn && (btn.style.display = "none"));
            const origText = btn.textContent, origLabel = btn.getAttribute("aria-label");
            let tid = null;
            btn.addEventListener("click", () => {
                navigator.clipboard.writeText(link.getAttribute("href").replace("tel:", "")).then(() => {
                    clearTimeout(tid); btn.textContent = "Copied!"; btn.setAttribute("aria-label", "Hotline number copied"); btn.classList.add("success");
                    tid = setTimeout(() => { btn.textContent = origText; btn.setAttribute("aria-label", origLabel); btn.classList.remove("success"); }, 2000);
                }).catch(() => {});
            });
        });
    </script>
</body>
</html>
