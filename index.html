<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; }
        .skip { position: absolute; top: -40px; }
        .skip:focus, .skip:focus-visible { top: 0; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; }
        a:focus-visible, button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; margin-top: 20px; background: #fafafa; }
        .btn { background: var(--primary); color: #fff; border: none; border-radius: 4px; padding: 6px 12px; cursor: pointer; margin-left: 8px; }
        .btn:hover { background: var(--primary-hover); } .btn.success { background: var(--success); }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section class="card">
            <h2>Customer Support</h2>
            <p>Hotline: <a href="tel:09606700700" id="hotline-link">09606 700 700</a><button id="copy-btn" class="btn" aria-label="Copy hotline phone number">Copy</button></p>
            <div id="copy-status" aria-live="polite" class="sr-only"></div>
        </section>
    </main>
    <script>
        (function() {
            var btn = document.getElementById('copy-btn'), status = document.getElementById('copy-status'), timer = null;
            if (btn && navigator.clipboard) {
                btn.addEventListener('click', function() {
                    navigator.clipboard.writeText('09606 700 700').then(function() {
                        btn.textContent = 'Copied!'; btn.classList.add('success'); status.textContent = 'Hotline number copied to clipboard';
                        if (timer) clearTimeout(timer);
                        timer = setTimeout(function() { btn.textContent = 'Copy'; btn.classList.remove('success'); status.textContent = ''; }, 2000);
                    }).catch(function() {});
                });
            }
        })();
    </script>
</body>
</html>
