<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .skip { position: absolute; top: -40px; left: 10px; background: var(--primary); color: white; padding: 8px 16px; text-decoration: none; border-radius: 4px; transition: top 0.2s ease; z-index: 100; }
        .skip:focus, .skip:focus-visible { top: 10px; outline: 2px solid var(--primary-hover); }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        .contact-card { border: 1px solid #ccc; border-radius: 8px; padding: 20px; margin-top: 20px; max-width: 400px; }
        .hotline-link { color: var(--primary); font-weight: bold; text-decoration: none; font-size: 1.25rem; }
        .hotline-link:hover, .hotline-link:focus-visible { text-decoration: underline; color: var(--primary-hover); outline: none; }
        .copy-btn { margin-left: 15px; background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: background 0.2s; font-size: 0.9rem; }
        .copy-btn:hover, .copy-btn:focus-visible { background: var(--primary-hover); outline: 2px solid #000; }
        .copy-btn.success { background: var(--success); }
        footer { text-align: center; padding: 20px; background: #eaeaea; font-size: 0.9rem; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>

        <div class="contact-card">
            <h2>Support Hotline</h2>
            <p>For assistance, contact our official support hotline:</p>
            <p style="display: flex; align-items: center; gap: 10px;">
                <a href="tel:09606700700" class="hotline-link" id="hotline-link" aria-label="Call hotline 0 9 6 0 6 7 0 0 7 0 0">09606 700 700</a>
                <button class="copy-btn" id="copy-btn" aria-label="Copy hotline number to clipboard">Copy</button>
            </p>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Minister Hi-Tech Park Limited. All rights reserved.</p>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const copyBtn = document.getElementById('copy-btn');
            const hotlineLink = document.getElementById('hotline-link');
            if (!copyBtn || !hotlineLink) return;

            const origText = copyBtn.textContent;
            const origAria = copyBtn.getAttribute('aria-label');
            const phoneNo = hotlineLink.getAttribute('href').replace('tel:', '');
            let timeoutId = null;

            copyBtn.addEventListener('click', async () => {
                if (timeoutId) clearTimeout(timeoutId);
                try {
                    await navigator.clipboard.writeText(phoneNo);
                    copyBtn.textContent = 'Copied!';
                    copyBtn.setAttribute('aria-label', 'Hotline number copied successfully');
                    copyBtn.classList.add('success');
                } catch (e) {
                    copyBtn.textContent = 'Failed';
                    copyBtn.setAttribute('aria-label', 'Failed to copy hotline number');
                }
                timeoutId = setTimeout(() => {
                    copyBtn.textContent = origText;
                    copyBtn.setAttribute('aria-label', origAria);
                    copyBtn.classList.remove('success');
                }, 2000);
            });
        });
    </script>
</body>
</html>
