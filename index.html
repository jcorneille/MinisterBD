<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .skip { position: absolute; top: -40px; background: var(--primary); color: white; padding: 8px; z-index: 100; transition: top 0.2s; }
        .skip:focus { top: 0; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        .contact-section { margin-top: 40px; padding: 20px; border-top: 1px solid #eee; }
        .hotline-container { display: flex; align-items: center; gap: 10px; }
        .copy-btn { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; transition: background 0.2s; }
        .copy-btn:hover { background: var(--primary-hover); }
        .copy-btn.success { background: var(--success) !important; }
        .copy-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section class="contact-section">
            <h2>Contact Our Support</h2>
            <div class="hotline-container">
                <span>Official Hotline: </span>
                <a href="tel:09606700700" id="hotline-link" aria-label="Call hotline 0 9 6 0 6. 7 0 0. 7 0 0">09606 700 700</a>
                <button id="copy-hotline" aria-label="Copy hotline number" class="copy-btn" onclick="copyHotline()">Copy</button>
            </div>
        </section>
    </main>
    <script>
        function copyHotline() {
            const btn = document.getElementById('copy-hotline');
            const link = document.getElementById('hotline-link');
            const number = link.getAttribute('href').replace('tel:', '');
            navigator.clipboard.writeText(number).then(() => {
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                btn.classList.add('success');
                btn.setAttribute('aria-label', 'Hotline number copied');
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('success');
                    btn.setAttribute('aria-label', 'Copy hotline number');
                }, 2000);
            }).catch(err => console.error('Failed to copy: ', err));
        }
    </script>
</body>
</html>
