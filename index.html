<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .skip { position: absolute; top: -40px; transition: top 0.2s; }
        .skip:focus { top: 0; outline: 2px solid var(--primary); }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        footer { background: #f8f9fa; padding: 20px; border-top: 1px solid #dee2e6; text-align: center; font-size: 0.9rem; }
        .btn { background: var(--primary); color: white; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: var(--primary-hover); }
        .btn.success { background: var(--success); }
        a { color: var(--primary); text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
    </main>
    <footer>
        <p>Hotline: <a href="tel:09606700700" aria-label="Call hotline 0 9 6 0 6 7 0 0 7 0 0">09606 700 700</a>
        <button id="copy-btn" class="btn" aria-label="Copy hotline number to clipboard">Copy</button>
        &nbsp;&nbsp;|&nbsp;&nbsp;
        Email: <a href="mailto:info@ministerbd.com">info@ministerbd.com</a></p>
    </footer>
    <script>
        const copyBtn = document.getElementById('copy-btn');
        let copyTimer;
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText('09606700700').then(() => {
                const originalText = copyBtn.textContent;
                const originalAria = copyBtn.getAttribute('aria-label');
                copyBtn.textContent = 'Copied!';
                copyBtn.setAttribute('aria-label', 'Hotline number copied to clipboard');
                copyBtn.classList.add('success');
                clearTimeout(copyTimer);
                copyTimer = setTimeout(() => {
                    copyBtn.textContent = originalText;
                    copyBtn.setAttribute('aria-label', originalAria);
                    copyBtn.classList.remove('success');
                }, 2000);
            });
        });
    </script>
</body>
</html>
