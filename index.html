<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .skip { position: absolute; top: -40px; left: 20px; background: var(--primary); color: #fff; padding: 8px; text-decoration: none; border-radius: 0 0 4px 4px; transition: top 0.2s; }
        .skip:focus-visible { top: 0; outline: 2px solid #fff; outline-offset: -4px; }
        main { flex: 1; max-width: 800px; margin: 0 auto; padding: 40px 20px; width: 100%; box-sizing: border-box; }
        footer { background: #f8f9fa; border-top: 1px solid #dee2e6; padding: 20px; text-align: center; }
        .hotline-container { display: inline-flex; align-items: center; gap: 10px; font-weight: bold; }
        .hotline-link { color: var(--primary); text-decoration: none; }
        .hotline-link:hover { text-decoration: underline; }
        .copy-btn { background: var(--primary); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; transition: background 0.2s; }
        .copy-btn:hover { background: var(--primary-hover); }
        .copy-btn.success { background: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
    </main>
    <footer>
        <div class="hotline-container">
            <span>Hotline: <a href="tel:09606700700" class="hotline-link" id="hotline-num">09606 700 700</a></span>
            <button id="copy-btn" class="copy-btn" aria-label="Copy hotline number to clipboard">Copy</button>
        </div>
    </footer>
    <script>
        const copyBtn = document.getElementById('copy-btn');
        const hotlineNum = document.getElementById('hotline-num');
        let timeout;
        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(hotlineNum.innerText);
                clearTimeout(timeout);
                copyBtn.innerText = 'Copied!';
                copyBtn.classList.add('success');
                copyBtn.setAttribute('aria-label', 'Hotline number copied to clipboard');
                timeout = setTimeout(() => {
                    copyBtn.innerText = 'Copy';
                    copyBtn.classList.remove('success');
                    copyBtn.setAttribute('aria-label', 'Copy hotline number to clipboard');
                }, 2000);
            } catch (err) { console.error('Failed to copy: ', err); }
        });
    </script>
</body>
</html>
