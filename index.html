<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        .skip { position: absolute; top: -40px; left: 10px; background: var(--primary); color: white; padding: 8px; z-index: 100; transition: top 0.2s; text-decoration: none; border-radius: 0 0 4px 4px; }
        .skip:focus { top: 0; outline: 2px solid var(--primary); outline-offset: 2px; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        footer { background: #f8f9fa; padding: 20px; text-align: center; border-top: 1px solid #dee2e6; font-size: 0.9rem; }
        .contact-link { color: var(--primary); text-decoration: none; font-weight: bold; }
        .contact-link:hover, .contact-link:focus { text-decoration: underline; outline: none; }
        .copy-btn { margin-left: 10px; padding: 4px 12px; cursor: pointer; background: var(--primary); color: white; border: none; border-radius: 4px; transition: background 0.2s; }
        .copy-btn:hover { background: var(--primary-hover); }
        .copy-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        .copy-btn.success { background: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
    </main>
    <footer>
        <p>Hotline: <a href="tel:09606700700" class="contact-link" id="hotline">09606 700 700</a> <button class="copy-btn" id="copy-hotline" aria-label="Copy hotline number">Copy</button></p>
        <p>Email: <a href="mailto:info@ministerbd.com" class="contact-link">info@ministerbd.com</a></p>
    </footer>
    <script>
        const btn = document.getElementById('copy-hotline');
        const hotline = document.getElementById('hotline');
        if (navigator.clipboard) {
            btn.onclick = () => {
                const text = hotline.href.replace('tel:', '');
                navigator.clipboard.writeText(text).then(() => {
                    const original = btn.innerText; btn.innerText = 'Copied!'; btn.classList.add('success');
                    btn.setAttribute('aria-label', 'Hotline number copied');
                    setTimeout(() => {
                        btn.innerText = original; btn.classList.remove('success');
                        btn.setAttribute('aria-label', 'Copy hotline number');
                    }, 2000);
                });
            };
        } else { btn.style.display = 'none'; }
    </script>
</body>
</html>
