<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .skip { position: absolute; top: -40px; transition: top 0.2s; background: var(--primary); color: #fff; padding: 8px; text-decoration: none; }
        .skip:focus, .skip:focus-visible { top: 0; outline: 2px solid var(--primary-hover); }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        .support-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; background: #f8fafc; margin-top: 24px; }
        .hotline-wrapper { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
        .hotline-link { color: var(--primary); font-weight: bold; text-decoration: none; font-size: 1.1rem; }
        .hotline-link:hover, .hotline-link:focus, .hotline-link:focus-visible { text-decoration: underline; outline: 2px solid var(--primary); }
        .copy-btn { background: var(--primary); color: #fff; border: none; border-radius: 4px; padding: 6px 14px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
        .copy-btn:hover, .copy-btn:focus, .copy-btn:focus-visible { background: var(--primary-hover); outline: 2px solid var(--primary); }
        .copy-btn.success, .copy-btn.success:hover { background: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section class="support-card" aria-labelledby="support-heading">
            <h2 id="support-heading">Customer Support</h2>
            <p>Need assistance? Contact our official hotline:</p>
            <div class="hotline-wrapper">
                <a href="tel:09606700700" class="hotline-link" id="hotline-link">09606 700 700</a>
                <button type="button" class="copy-btn" id="copy-hotline-btn" aria-label="Copy hotline number 09606 700 700 to clipboard">Copy</button>
            </div>
        </section>
    </main>
    <script>
        (function() {
            var btn = document.getElementById('copy-hotline-btn'), link = document.getElementById('hotline-link'), tid;
            if (!btn || !link) return;
            var origText = btn.textContent, origAria = btn.getAttribute('aria-label');
            btn.addEventListener('click', function() {
                if (navigator.clipboard) navigator.clipboard.writeText(link.getAttribute('href').replace('tel:', ''));
                btn.textContent = 'Copied!'; btn.classList.add('success');
                btn.setAttribute('aria-label', 'Hotline number copied to clipboard');
                clearTimeout(tid);
                tid = setTimeout(function() { btn.textContent = origText; btn.classList.remove('success'); btn.setAttribute('aria-label', origAria); }, 2000);
            });
        })();
    </script>
</body>
</html>
