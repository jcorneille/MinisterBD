<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
        .skip { position: absolute; top: -50px; left: 10px; background: var(--primary); color: #fff; padding: 8px 12px; border-radius: 4px; z-index: 100; transition: top 0.2s; text-decoration: none; }
        .skip:focus, .skip:focus-visible { top: 10px; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        .contact-card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 16px; margin-top: 20px; }
        .contact-card a { color: var(--primary); font-weight: bold; text-decoration: none; }
        .contact-card a:hover { color: var(--primary-hover); text-decoration: underline; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section class="contact-card" aria-labelledby="support-heading">
            <h2 id="support-heading" style="margin-top:0">Customer Support</h2>
            <p>Hotline: <a href="tel:09606700700" aria-label="Call Customer Support Hotline at 09606 700 700">09606 700 700</a></p>
            <p>Email: <a href="mailto:info@ministerbd.com" aria-label="Email Customer Support at info@ministerbd.com">info@ministerbd.com</a></p>
        </section>
    </main>
</body>
</html>
