<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        .skip { position: absolute; top: -40px; left: 10px; background: var(--primary); color: #fff; padding: 8px 12px; text-decoration: none; border-radius: 4px; transition: top 0.2s; z-index: 100; }
        .skip:focus, .skip:focus-visible { top: 10px; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        .hotline-card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
        .hotline-link { font-size: 1.25rem; font-weight: bold; color: var(--primary); text-decoration: none; }
        .hotline-link:hover { text-decoration: underline; }
        .btn-copy { background: var(--primary); color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; transition: background-color 0.2s; }
        .btn-copy:hover { background: var(--primary-hover); }
        .btn-copy.success { background: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section class="hotline-card" aria-label="Customer Support Hotline">
            <div>
                <h2 style="margin: 0 0 4px; font-size: 1.1rem;">Customer Support Hotline</h2>
                <a href="tel:09606700700" class="hotline-link" id="hotline-link">09606 700 700</a>
            </div>
            <button type="button" class="btn-copy" id="copy-btn" aria-label="Copy hotline number to clipboard">Copy Hotline</button>
        </section>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('copy-btn');
            const link = document.getElementById('hotline-link');
            if (!btn || !link || !navigator.clipboard) return;
            const origText = btn.textContent;
            const origAria = btn.getAttribute('aria-label');
            let timer = null;
            btn.addEventListener('click', async () => {
                const num = link.getAttribute('href').replace('tel:', '');
                try {
                    await navigator.clipboard.writeText(num);
                    if (timer) clearTimeout(timer);
                    btn.textContent = 'Copied!';
                    btn.classList.add('success');
                    btn.setAttribute('aria-label', 'Hotline number copied to clipboard');
                    timer = setTimeout(() => {
                        btn.textContent = origText;
                        btn.classList.remove('success');
                        btn.setAttribute('aria-label', origAria);
                    }, 2000);
                } catch (e) { /* fallback if copy fails */ }
            });
        });
    </script>
</body>
</html>
