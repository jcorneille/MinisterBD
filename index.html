<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .skip { position: absolute; top: -40px; transition: top 0.2s; }
        .skip:focus, .skip:focus-visible { top: 0; }
        :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        main { flex: 1; max-width: 800px; margin: 40px auto; padding: 20px; width: 100%; box-sizing: border-box; }
        .card { border: 1px solid #dee2e6; padding: 20px; border-radius: 8px; margin-top: 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 400px; }
        .btn { background: var(--primary); color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: var(--primary-hover); }
        .btn.success { background: var(--success); }
        footer { padding: 20px; text-align: center; border-top: 1px solid #dee2e6; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <div class="card">
            <div>
                <h3>Hotline Contact</h3>
                <a id="hotline-link" href="tel:09606700700" aria-label="Call hotline 0 9 6 0 6 7 0 0 7 0 0">09606 700 700</a>
            </div>
            <button id="copy-btn" class="btn" aria-label="Copy hotline phone number">Copy</button>
        </div>
    </main>
    <footer>&copy; 2026 Minister Hi-Tech Park Limited</footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('copy-btn'), link = document.getElementById('hotline-link');
            if (!btn || !link || !navigator.clipboard) { if (btn && !navigator.clipboard) btn.style.display = 'none'; return; }
            const origText = btn.textContent, origLabel = btn.getAttribute('aria-label'), rawValue = link.getAttribute('href').replace('tel:', '');
            let timeoutId = null;
            btn.addEventListener('click', () => {
                navigator.clipboard.writeText(rawValue).then(() => {
                    if (timeoutId) clearTimeout(timeoutId);
                    btn.textContent = 'Copied!'; btn.classList.add('success'); btn.setAttribute('aria-label', 'Phone number copied successfully');
                    timeoutId = setTimeout(() => { btn.textContent = origText; btn.classList.remove('success'); btn.setAttribute('aria-label', origLabel); }, 2000);
                }).catch(err => console.error('Failed to copy text: ', err));
            });
        });
    </script>
</body>
</html>
