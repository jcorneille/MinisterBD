<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        .skip { position: absolute; top: -40px; left: 20px; transition: top 0.2s ease-in-out; background: var(--primary); color: white; padding: 8px 16px; text-decoration: none; border-radius: 0 0 4px 4px; z-index: 1000; }
        .skip:focus-visible { top: 0; outline: none; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        .hotline-sec { margin-top: 40px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; text-align: center; }
        .hotline-num { font-size: 1.5rem; font-weight: bold; text-decoration: none; color: var(--primary); margin-right: 15px; }
        .hotline-num:hover { color: var(--primary-hover); text-decoration: underline; }
        .btn-copy { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; transition: background 0.2s; font-size: 1rem; }
        .btn-copy:hover { background: var(--primary-hover); }
        .btn-copy.success { background: var(--success); }
        .btn-copy:focus-visible, .hotline-num:focus-visible, .skip:focus-visible { outline: 2px solid var(--primary-hover); outline-offset: 2px; }
        footer { padding: 20px; text-align: center; font-size: 0.9rem; color: #666; border-top: 1px solid #eee; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section class="hotline-sec">
            <h2>Customer Support Hotline</h2>
            <p>For any inquiries or assistance, please contact our support team:</p>
            <a href="tel:09606700700" class="hotline-num" aria-label="Call hotline 0 9 6 0 6 7 0 0 7 0 0">09606 700 700</a>
            <button class="btn-copy" aria-label="Copy hotline number to clipboard" id="copy-btn">Copy Number</button>
        </section>
    </main>
    <footer><p>&copy; 2026 Minister Hi-Tech Park Limited. All rights reserved.</p></footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('copy-btn');
            let timeoutId = null;
            btn.addEventListener('click', () => {
                if (timeoutId) clearTimeout(timeoutId);
                const copyText = (val) => {
                    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(val);
                    const el = document.createElement('textarea'); el.value = val; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); return Promise.resolve();
                };
                copyText('09606700700').then(() => {
                    btn.textContent = 'Copied!'; btn.setAttribute('aria-label', 'Hotline number copied successfully'); btn.classList.add('success');
                    timeoutId = setTimeout(() => {
                        btn.textContent = 'Copy Number'; btn.setAttribute('aria-label', 'Copy hotline number to clipboard'); btn.classList.remove('success');
                    }, 2000);
                });
            });
        });
    </script>
</body>
</html>
