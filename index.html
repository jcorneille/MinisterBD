<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { display: flex; flex-direction: column; min-height: 100vh; font-family: sans-serif; margin: 0; background: #f8f9fa; }
        .skip { position: absolute; top: -40px; left: 10px; background: var(--primary); color: #fff; padding: 8px 16px; z-index: 100; transition: top 0.2s; text-decoration: none; border-radius: 4px; }
        .skip:focus-visible { top: 0; }
        *:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
        main { flex: 1; max-width: 600px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .hotline-sec { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .hotline-container { display: flex; align-items: center; gap: 15px; margin-top: 10px; }
        .hotline-link { font-size: 1.5rem; font-weight: bold; color: var(--primary); text-decoration: none; padding: 4px; border-radius: 4px; }
        .hotline-link:hover { text-decoration: underline; }
        .copy-btn { background: var(--primary); color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; transition: background 0.2s; }
        .copy-btn:hover { background: var(--primary-hover); }
        .hotline-container .copy-btn.success { background: var(--success); }
        footer { text-align: center; padding: 20px; background: #eee; font-size: 0.9rem; color: #666; }
        footer a { color: var(--primary); text-decoration: none; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section class="hotline-sec">
            <h2>Our Hotline</h2>
            <div class="hotline-container">
                <a href="tel:09606700700" class="hotline-link" aria-label="Call hotline 0 9 6 0 6 7 0 0 7 0 0">09606 700 700</a>
                <button id="copy-btn" class="copy-btn" aria-label="Copy hotline number to clipboard">Copy</button>
            </div>
        </section>
    </main>
    <footer>
        <p>Contact us at <a href="mailto:info@ministerbd.com" aria-label="Email info at minister b d dot com">info@ministerbd.com</a></p>
    </footer>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const btn = document.getElementById("copy-btn");
            const link = document.querySelector(".hotline-link");
            if (!btn || !link) return;
            if (!navigator.clipboard) { btn.style.display = "none"; return; }
            const origText = btn.textContent, origLabel = btn.getAttribute("aria-label");
            let timer;
            btn.addEventListener("click", () => {
                const num = link.getAttribute("href").replace("tel:", "");
                navigator.clipboard.writeText(num).then(() => {
                    clearTimeout(timer);
                    btn.textContent = "Copied!";
                    btn.setAttribute("aria-label", "Hotline number copied successfully");
                    btn.classList.add("success");
                    timer = setTimeout(() => {
                        btn.textContent = origText;
                        btn.setAttribute("aria-label", origLabel);
                        btn.classList.remove("success");
                    }, 2000);
                });
            });
        });
    </script>
</body>
</html>
