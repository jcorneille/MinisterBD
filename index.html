<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --success: #28a745; --bg-f: #f8f9fa; }
        body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        .skip { position: absolute; top: -40px; transition: top 0.2s; }
        .skip:focus { top: 0; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        footer { background: var(--bg-f); padding: 20px; text-align: center; border-top: 1px solid #ddd; }
        .h-link { color: var(--primary); text-decoration: none; font-weight: 500; margin: 0 10px; }
        .copy-btn { padding: 4px 8px; border-radius: 4px; cursor: pointer; border: 1px solid #ccc; transition: 0.2s; }
        .copy-btn.copied { background: var(--success); color: white; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
    </main>
    <footer>
        Hotline: <a href="tel:09606700700" class="h-link" id="hotline">09606 700 700</a>
        <button id="copy-btn" class="copy-btn" aria-label="Copy hotline">Copy</button>
    </footer>
    <script>
        document.getElementById('copy-btn').onclick = async (e) => {
            const btn = e.target; const num = document.getElementById('hotline').innerText;
            await navigator.clipboard.writeText(num);
            const oldT = btn.innerText; const oldA = btn.ariaLabel;
            btn.innerText = 'Copied!'; btn.ariaLabel = 'Copied to clipboard'; btn.classList.add('copied');
            setTimeout(() => { btn.innerText = oldT; btn.ariaLabel = oldA; btn.classList.remove('copied'); }, 2000);
        };
    </script>
</body>
</html>
