<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        .skip { position: absolute; top: -40px; transition: top 0.2s; }
        .skip:focus, .skip:focus-visible { top: 0; background: var(--primary); color: #fff; padding: 8px 16px; z-index: 100; text-decoration: none; border-radius: 0 0 4px 4px; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        .contact-card { margin-top: 24px; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; background: #f9f9f9; }
        .phone-link { color: var(--primary); text-decoration: none; font-weight: bold; }
        .phone-link:hover { text-decoration: underline; }
        .phone-link:focus-visible, .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        .btn { background: var(--primary); color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; margin-top: 8px; }
        .btn:hover { background: var(--primary-hover); }
        .btn.success { background: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <div class="contact-card">
            <h2>Customer Support</h2>
            <p>Hotline: <a href="tel:09606700700" id="hotline-link" class="phone-link">09606 700 700</a></p>
            <button id="copy-btn" class="btn" aria-label="Copy hotline phone number">Copy Hotline</button>
        </div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('copy-btn'), link = document.getElementById('hotline-link');
            if (!btn || !link) return;
            let timer = null, text = btn.textContent, label = btn.getAttribute('aria-label');
            btn.addEventListener('click', async () => {
                if (!navigator.clipboard) return;
                try {
                    await navigator.clipboard.writeText(link.getAttribute('href').replace('tel:', ''));
                    if (timer) clearTimeout(timer);
                    btn.textContent = 'Copied!';
                    btn.setAttribute('aria-label', 'Hotline phone number copied');
                    btn.classList.add('success');
                    timer = setTimeout(() => { btn.textContent = text; btn.setAttribute('aria-label', label); btn.classList.remove('success'); }, 2000);
                } catch {}
            });
        });
    </script>
</body>
</html>
