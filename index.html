<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; }
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .skip { position: absolute; top: -40px; transition: top 0.2s; }
        .skip:focus, .skip:focus-visible { top: 0; background: #fff; padding: 8px; z-index: 100; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        .contact-card { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin-top: 24px; background: #f9f9f9; }
        .contact-link { color: var(--primary); text-decoration: none; font-weight: bold; }
        .contact-link:hover, .contact-link:focus-visible { color: var(--primary-hover); text-decoration: underline; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section class="contact-card" aria-labelledby="support-heading">
            <h2 id="support-heading">Customer Support</h2>
            <p>Hotline: <a class="contact-link" href="tel:09606700700">09606 700 700</a></p>
            <p>Email: <a class="contact-link" href="mailto:info@ministerbd.com">info@ministerbd.com</a></p>
        </section>
    </main>
</body>
</html>
