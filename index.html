<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; line-height: 1.5; }
        :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        .skip { position: absolute; top: -100px; transition: top 0.2s; background: #fff; padding: 8px 16px; border: 1px solid var(--primary); }
        .skip:focus, .skip:focus-visible { top: 0; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; }
        .card { border: 1px solid #dee2e6; border-radius: 8px; padding: 1.25rem; margin-top: 1.5rem; background: #fdfdfd; }
        .contact-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .contact-link { color: var(--primary); font-weight: 600; text-decoration: none; font-size: 1.1rem; }
        .btn-copy { font-size: 0.9rem; padding: 6px 12px; cursor: pointer; border-radius: 4px; border: 1px solid var(--primary); background: #fff; color: var(--primary); font-weight: 600; transition: all 0.2s; }
        .btn-copy:hover { background: var(--primary-hover); color: #fff; }
        .btn-copy.copied, .btn-copy.copied:hover { background: var(--success); border-color: var(--success); color: #fff; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section class="card" aria-labelledby="support-heading">
            <h2 id="support-heading" style="margin-top: 0;">Customer Support Hotline</h2>
            <div class="contact-row">
                <a id="phone-link" class="contact-link" href="tel:09606700700" aria-label="Call Minister Hotline 09606 700 700">📞 09606 700 700</a>
                <button type="button" class="btn-copy" id="copy-btn" aria-label="Copy phone number to clipboard">Copy Number</button>
            </div>
            <div aria-live="polite" id="copy-feedback" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0);"></div>
        </section>
    </main>
    <script>
        const copyBtn = document.getElementById('copy-btn'), phoneLink = document.getElementById('phone-link'), feedback = document.getElementById('copy-feedback');
        let timer = null;
        if (copyBtn && phoneLink && navigator.clipboard) {
            copyBtn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(phoneLink.getAttribute('href').replace('tel:', ''));
                    if (timer) clearTimeout(timer);
                    copyBtn.textContent = 'Copied!'; copyBtn.classList.add('copied'); copyBtn.setAttribute('aria-label', 'Phone number copied to clipboard'); feedback.textContent = 'Phone number copied to clipboard';
                    timer = setTimeout(() => {
                        copyBtn.textContent = 'Copy Number'; copyBtn.classList.remove('copied'); copyBtn.setAttribute('aria-label', 'Copy phone number to clipboard'); feedback.textContent = '';
                    }, 2000);
                } catch {}
            });
        }
    </script>
</body>
</html>
