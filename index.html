<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .skip { position: absolute; top: -40px; transition: top 0.2s; }
        .skip:focus-visible { top: 0; outline: 2px solid var(--primary); }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        footer { background: #f8f9fa; padding: 20px; text-align: center; border-top: 1px solid #dee2e6; }
        .btn-copy { background: var(--primary); color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; margin-left: 8px; font-size: 14px; }
        .btn-copy:hover { background: var(--primary-hover); }
        .btn-copy.success { background: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
    </main>
    <footer>
        <p>Hotline: <a href="tel:09606700700" id="hotline">09606 700 700</a>
        <button class="btn-copy" id="copyBtn" aria-label="Copy hotline number">Copy</button></p>
    </footer>
    <script>
        let copyTimeout;
        const btn = document.getElementById('copyBtn');
        if (!navigator.clipboard) { btn.style.display = 'none'; }
        btn.addEventListener('click', () => {
            const num = document.getElementById('hotline').innerText;
            navigator.clipboard.writeText(num).then(() => {
                clearTimeout(copyTimeout);
                btn.innerText = 'Copied!'; btn.classList.add('success');
                btn.setAttribute('aria-label', 'Copied hotline number');
                copyTimeout = setTimeout(() => {
                    btn.innerText = 'Copy'; btn.classList.remove('success');
                    btn.setAttribute('aria-label', 'Copy hotline number');
                }, 2000);
            });
        });
    </script>
</body>
</html>
