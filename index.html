<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        .skip { position: absolute; top: -100px; transition: top 0.2s; }
        .skip:focus, .skip:focus-visible { top: 0; background: #fff; padding: 8px; z-index: 10; outline: 2px solid var(--primary); }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; margin-top: 24px; background: #fafafa; }
        .contact-row { display: flex; align-items: center; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
        .btn { background: var(--primary); color: #fff; border: none; border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 14px; transition: background-color 0.2s; }
        .btn:hover { background: var(--primary-hover); }
        .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        .card .btn.success { background: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section class="card" aria-labelledby="support-heading">
            <h2 id="support-heading" style="margin-top:0;font-size:1.2rem;">Customer Support</h2>
            <p style="margin:0 0 8px;">Need assistance? Reach our official hotline:</p>
            <div class="contact-row">
                <a id="hotline-link" href="tel:09606700700" style="color:var(--primary);font-weight:bold;text-decoration:none;">09606 700 700</a>
                <button type="button" id="copy-btn" class="btn" aria-label="Copy hotline number">Copy</button>
            </div>
        </section>
    </main>
    <script>
        const copyBtn = document.getElementById('copy-btn');
        const link = document.getElementById('hotline-link');
        if (copyBtn && link && navigator.clipboard) {
            const origLabel = copyBtn.getAttribute('aria-label'), origText = copyBtn.textContent;
            let timeoutId;
            copyBtn.addEventListener('click', async () => {
                await navigator.clipboard.writeText(link.getAttribute('href').replace('tel:', ''));
                clearTimeout(timeoutId);
                copyBtn.textContent = 'Copied!';
                copyBtn.classList.add('success');
                copyBtn.setAttribute('aria-label', 'Hotline number copied to clipboard');
                timeoutId = setTimeout(() => {
                    copyBtn.textContent = origText;
                    copyBtn.classList.remove('success');
                    copyBtn.setAttribute('aria-label', origLabel);
                }, 2000);
            });
        }
    </script>
</body>
</html>
