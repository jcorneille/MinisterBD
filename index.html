<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        *:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        main { flex: 1; max-width: 800px; margin: 40px auto; padding: 20px; }
        .skip { position: absolute; top: -40px; transition: top 0.2s; z-index: 100; }
        .skip:focus, .skip:focus-visible { top: 0; }
        .footer { background: #f8f9fa; padding: 20px; text-align: center; border-top: 1px solid #e9ecef; }
        .footer-content { display: inline-flex; align-items: center; gap: 10px; }
        #hotline { color: var(--primary); font-weight: bold; text-decoration: none; }
        #hotline:hover { text-decoration: underline; }
        .btn { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        .btn:hover { background: var(--primary-hover); }
        .btn.success { background: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <span>Helpline:</span>
            <a id="hotline" href="tel:09606700700" aria-label="Call hotline 0 9 6 0 6 7 0 0 7 0 0">09606 700 700</a>
            <button id="copy-btn" class="btn" aria-label="Copy hotline number">Copy</button>
        </div>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('copy-btn'), link = document.getElementById('hotline');
            if (!btn || !link) return;
            if (!navigator.clipboard) { btn.style.display = 'none'; return; }
            const origTxt = btn.textContent, origAria = btn.getAttribute('aria-label') || '';
            let timeout = null;
            btn.addEventListener('click', async () => {
                const phone = link.getAttribute('href').replace('tel:', '');
                try {
                    await navigator.clipboard.writeText(phone);
                    if (timeout) clearTimeout(timeout);
                    btn.textContent = 'Copied!'; btn.setAttribute('aria-label', 'Phone number copied successfully'); btn.classList.add('success');
                    timeout = setTimeout(() => {
                        btn.textContent = origTxt; btn.setAttribute('aria-label', origAria); btn.classList.remove('success');
                    }, 1500);
                } catch (e) { console.error(e); }
            });
        });
    </script>
</body>
</html>
