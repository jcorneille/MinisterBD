<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .skip { position: absolute; top: -40px; }
        .skip:focus, .skip:focus-visible { top: 0; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        .hotline-card { display: flex; align-items: center; gap: 12px; padding: 16px; border: 1px solid #ccc; border-radius: 8px; margin-top: 20px; }
        .hotline-link { color: var(--primary); text-decoration: none; font-weight: bold; }
        .hotline-link:hover, .hotline-link:focus-visible { color: var(--primary-hover); text-decoration: underline; }
        .copy-btn { padding: 6px 12px; background: var(--primary); color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .copy-btn:hover { background: var(--primary-hover); }
        .copy-btn.success { background: var(--success); }
        :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <div class="hotline-card">
            <span>Customer Hotline:</span>
            <a href="tel:09606700700" class="hotline-link" id="hotline-link">09606 700 700</a>
            <button id="copy-btn" class="copy-btn" aria-label="Copy hotline number">Copy</button>
        </div>
    </main>
    <script>
        let timer;
        const btn = document.getElementById('copy-btn');
        const link = document.getElementById('hotline-link');
        if (btn && link) {
            btn.addEventListener('click', () => {
                const number = link.getAttribute('href').replace('tel:', '');
                if (navigator.clipboard) navigator.clipboard.writeText(number);
                clearTimeout(timer);
                btn.textContent = 'Copied!';
                btn.classList.add('success');
                btn.setAttribute('aria-label', 'Hotline number copied');
                timer = setTimeout(() => {
                    btn.textContent = 'Copy';
                    btn.classList.remove('success');
                    btn.setAttribute('aria-label', 'Copy hotline number');
                }, 2000);
            });
        }
    </script>
</body>
</html>
