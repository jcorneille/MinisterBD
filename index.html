<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .skip { position: absolute; top: -40px; transition: top 0.2s; }
        .skip:focus, .skip:focus-visible { top: 0; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-top: 20px; max-width: 400px; }
        .hotline-link { color: var(--primary); text-decoration: none; font-weight: bold; }
        .hotline-link:hover { color: var(--primary-hover); text-decoration: underline; }
        .btn { background: var(--primary); color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-left: 10px; }
        .btn:hover { background: var(--primary-hover); }
        .btn.success { background: var(--success); }
        footer { padding: 20px; background: #f4f4f4; text-align: center; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <div class="card">
            <h2>Customer Support</h2>
            <p>Need assistance? Contact our official hotline:</p>
            <a id="hotline" href="tel:09606700700" class="hotline-link" aria-label="Call hotline 0 9 6 0 6 7 0 0 7 0 0">09606 700 700</a>
            <button id="copy-btn" class="btn" aria-label="Copy hotline number">Copy</button>
        </div>
    </main>
    <footer><p>&copy; 2026 Minister Hi-Tech Park Limited. All rights reserved.</p></footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('copy-btn'), link = document.getElementById('hotline');
            if (!btn || !link || !navigator.clipboard) { if (btn) btn.style.display = 'none'; return; }
            const origText = btn.textContent, origAria = btn.getAttribute('aria-label');
            let timeoutId = null;
            btn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(link.getAttribute('href').replace('tel:', ''));
                    if (timeoutId) clearTimeout(timeoutId);
                    btn.textContent = 'Copied!'; btn.setAttribute('aria-label', 'Copied successfully'); btn.classList.add('success');
                    timeoutId = setTimeout(() => { btn.textContent = origText; btn.setAttribute('aria-label', origAria); btn.classList.remove('success'); }, 1500);
                } catch (e) { console.error(e); }
            });
        });
    </script>
</body>
</html>
