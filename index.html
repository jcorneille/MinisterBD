<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; }
        body { font-family: sans-serif; margin: 0; line-height: 1.5; }
        .skip { position: absolute; top: -40px; background: var(--primary); color: #fff; padding: 8px 12px; z-index: 100; text-decoration: none; border-radius: 0 0 4px 0; transition: top 0.2s; }
        .skip:focus, .skip:focus-visible { top: 0; outline: 2px solid #000; }
        a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; }
        .contact-card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 16px; margin-top: 24px; }
        .contact-link { color: var(--primary); font-weight: 600; text-decoration: underline; }
        .contact-link:hover { color: var(--primary-hover); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section class="contact-card" aria-labelledby="support-heading">
            <h2 id="support-heading">Customer Support</h2>
            <p>Need help? Reach out to Minister Hi-Tech Park:</p>
            <p>📞 Hotline: <a href="tel:09606700700" class="contact-link">09606 700 700</a></p>
            <p>✉️ Email: <a href="mailto:info@ministerbd.com" class="contact-link">info@ministerbd.com</a></p>
        </section>
    </main>
</body>
</html>
