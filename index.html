<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .skip { position: absolute; top: -40px; transition: top 0.2s; }
        .skip:focus-visible { top: 0; }
        main { flex: 1; max-width: 800px; margin: 40px auto; padding: 20px; }
        .footer { padding: 15px; background: #f8f9fa; border-top: 1px solid #ddd; text-align: center; font-size: 14px; display: flex; justify-content: center; align-items: center; gap: 12px; }
        .tel-link { color: var(--primary); font-weight: bold; text-decoration: none; }
        .tel-link:hover { text-decoration: underline; }
        .btn { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: var(--primary-hover); }
        .btn.success { background: var(--success); }
        *:focus-visible { outline: 2px solid var(--primary-hover); outline-offset: 2px; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
    </main>
    <footer class="footer">
        <span>Need assistance?</span>
        <a id="hotline-link" href="tel:09606700700" aria-label="Call hotline 0 9 6 0 6 7 0 0 7 0 0" class="tel-link">09606 700 700</a>
        <button id="copy-btn" aria-label="Copy hotline number" class="btn">Copy</button>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('copy-btn');
            if (!btn) return;
            if (!navigator.clipboard) { btn.style.display = 'none'; return; }
            const origText = btn.textContent, origAria = btn.getAttribute('aria-label');
            let timeoutId = null;
            btn.addEventListener('click', () => {
                navigator.clipboard.writeText('09606700700').then(() => {
                    if (timeoutId) clearTimeout(timeoutId);
                    btn.textContent = 'Copied!';
                    btn.setAttribute('aria-label', 'Hotline number copied');
                    btn.classList.add('success');
                    timeoutId = setTimeout(() => {
                        btn.textContent = origText;
                        btn.setAttribute('aria-label', origAria);
                        btn.classList.remove('success');
                    }, 2000);
                }).catch(() => {});
            });
        });
    </script>
</body>
</html>
