<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; }
        body { font-family: sans-serif; margin: 0; }
        .skip { position: absolute; top: -40px; }
        .skip:focus { top: 0; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; }
        .contact-info { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #eee; }
        .btn-copy { background: var(--primary); color: white; border: none; padding: 4px 12px; cursor: pointer; border-radius: 4px; font-size: 0.85rem; margin-left: 8px; transition: all 0.2s; }
        .btn-copy:hover { opacity: 0.9; }
        .btn-copy.success { background: #1e7e34; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section id="contact" class="contact-info">
            <h2>Contact Us</h2>
            <p>Hotline: <a href="tel:09606700700" aria-label="Call hotline 0 9 6 0 6 7 0 0 7 0 0">09606 700 700</a>
            <button id="copy-hotline" class="btn-copy" aria-label="Copy hotline number to clipboard">Copy</button></p>
            <p>Email: <a href="mailto:info@ministerbd.com">info@ministerbd.com</a></p>
        </section>
    </main>
    <script>
        document.getElementById('copy-hotline').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            try {
                await navigator.clipboard.writeText('09606700700');
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                btn.classList.add('success');
                btn.setAttribute('aria-label', 'Hotline number copied');
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('success');
                    btn.setAttribute('aria-label', 'Copy hotline number to clipboard');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy: ', err);
            }
        });
    </script>
</body>
</html>
