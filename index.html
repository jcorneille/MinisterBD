<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .skip { position: absolute; top: -40px; left: 10px; background: var(--primary); color: white; padding: 8px 12px; z-index: 100; transition: top 0.2s ease; text-decoration: none; border-radius: 4px; }
        .skip:focus-visible { top: 10px; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-top: 20px; }
        .contact-item { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .btn { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: var(--primary-hover); }
        .btn.success { background: var(--success); }
        .btn:focus-visible, a:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
        footer { text-align: center; padding: 20px; background: #f8f9fa; border-top: 1px solid #e9ecef; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <div class="card">
            <h2>Contact Us</h2>
            <div class="contact-item">
                <strong>Hotline:</strong>
                <a id="hotline-link" href="tel:09606700700" aria-label="Call hotline 0 9 6 0 6 7 0 0 7 0 0">09606 700 700</a>
                <button id="copy-btn" class="btn" aria-label="Copy hotline to clipboard" style="display: none;">Copy</button>
            </div>
            <div class="contact-item">
                <strong>Email:</strong>
                <a href="mailto:info@ministerbd.com" aria-label="Send email to info@ministerbd.com">info@ministerbd.com</a>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 Minister Hi-Tech Park Limited.</p></footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('copy-btn'), link = document.getElementById('hotline-link');
            if (btn && link && navigator.clipboard) {
                btn.style.display = 'inline-block';
                const origText = btn.textContent, origLabel = btn.getAttribute('aria-label');
                let timeoutId = null;
                btn.addEventListener('click', () => {
                    const num = link.getAttribute('href').replace('tel:', '');
                    navigator.clipboard.writeText(num).then(() => {
                        if (timeoutId) clearTimeout(timeoutId);
                        btn.textContent = 'Copied!';
                        btn.setAttribute('aria-label', 'Hotline copied successfully');
                        btn.classList.add('success');
                        timeoutId = setTimeout(() => {
                            btn.textContent = origText;
                            btn.setAttribute('aria-label', origLabel);
                            btn.classList.remove('success');
                        }, 2000);
                    }).catch(() => {});
                });
            }
        });
    </script>
</body>
</html>
