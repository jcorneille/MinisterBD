<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        .skip { position: absolute; top: -40px; transition: top 0.2s; }
        .skip:focus, .skip:focus-visible { top: 0; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        .contact-card { display: flex; align-items: center; gap: 12px; margin-top: 24px; padding: 16px; border: 1px solid #e0e0e0; border-radius: 8px; }
        .tel-link { color: var(--primary); text-decoration: none; font-weight: bold; }
        .tel-link:hover, .tel-link:focus-visible { text-decoration: underline; }
        .copy-btn { background: var(--primary); color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .copy-btn:hover, .copy-btn:focus-visible { background: var(--primary-hover); }
        .copy-btn.success { background: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section class="contact-card" aria-label="Customer Support Hotline">
            <span>Hotline:</span>
            <a href="tel:09606700700" class="tel-link" id="hotline-link">09606 700 700</a>
            <button type="button" class="copy-btn" id="copy-btn" aria-label="Copy hotline number">Copy</button>
        </section>
    </main>
    <script>
        const btn = document.getElementById('copy-btn');
        const link = document.getElementById('hotline-link');
        let timer;
        btn?.addEventListener('click', async () => {
            const num = link.getAttribute('href').replace('tel:', '');
            if (navigator.clipboard) await navigator.clipboard.writeText(num);
            clearTimeout(timer);
            btn.textContent = 'Copied!';
            btn.classList.add('success');
            btn.setAttribute('aria-label', 'Hotline number copied');
            timer = setTimeout(() => {
                btn.textContent = 'Copy';
                btn.classList.remove('success');
                btn.setAttribute('aria-label', 'Copy hotline number');
            }, 2000);
        });
    </script>
</body>
</html>
