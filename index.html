<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root {
            --primary: #0056b3;
            --primary-hover: #004494;
            --success: #28a745;
        }
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; line-height: 1.5; color: #333; }
        *:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
        .skip {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 0 0 8px 8px;
            transition: top 0.2s ease-in-out;
            z-index: 100;
        }
        .skip:focus { top: 0; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; }
        .support-card {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 24px;
            margin-top: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fcfcfc;
        }
        .support-info h2 { margin: 0 0 8px 0; font-size: 1.25rem; }
        .hotline { font-weight: bold; color: var(--primary); font-size: 1.1rem; }
        .copy-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .copy-btn:hover { background: var(--primary-hover); }
        .copy-btn.success { background: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>

        <section class="support-card" aria-labelledby="support-title">
            <div class="support-info">
                <h2 id="support-title">Customer Support</h2>
                <p>Official Hotline: <span id="hotline-number" class="hotline">09606 700 700</span></p>
            </div>
            <button id="copy-hotline" class="copy-btn" aria-label="Copy hotline number to clipboard">
                Copy Number
            </button>
        </section>
    </main>
    <script>
        const copyBtn = document.getElementById('copy-hotline');
        const hotlineEl = document.getElementById('hotline-number');

        copyBtn.addEventListener('click', async () => {
            const text = hotlineEl.innerText.trim();
            try {
                await navigator.clipboard.writeText(text);

                const originalText = copyBtn.innerText;
                copyBtn.innerText = 'Copied!';
                copyBtn.classList.add('success');
                copyBtn.setAttribute('aria-label', 'Hotline number copied to clipboard');

                setTimeout(() => {
                    copyBtn.innerText = originalText;
                    copyBtn.classList.remove('success');
                    copyBtn.setAttribute('aria-label', 'Copy hotline number to clipboard');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy: ', err);
            }
        });
    </script>
</body>
</html>
