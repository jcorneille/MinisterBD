<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        *:focus-visible { outline: 3px solid var(--primary); }
        .skip { position: absolute; top: -40px; left: 10px; background: var(--primary); color: white; padding: 8px 12px; text-decoration: none; border-radius: 4px; transition: top 0.2s ease; z-index: 100; }
        .skip:focus, .skip:focus-visible { top: 10px; outline: 3px solid var(--primary-hover); }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        .hotline-card { border: 1px solid #ccc; border-radius: 8px; padding: 20px; margin-top: 30px; max-width: 400px; }
        .hotline-actions { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
        .hotline-link { color: var(--primary); font-weight: bold; font-size: 1.2rem; text-decoration: none; }
        .hotline-link:hover { text-decoration: underline; }
        .copy-btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; transition: background 0.2s; font-size: 0.9rem; }
        .copy-btn:hover { background: var(--primary-hover); }
        .copy-btn.success { background: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <div class="hotline-card">
            <h2>Customer Support</h2>
            <p>If you need assistance, please call our official hotline:</p>
            <div class="hotline-actions">
                <a href="tel:09606700700" class="hotline-link" aria-label="Call hotline 0 9 6 0 6 7 0 0 7 0 0">09606 700 700</a>
                <button id="copy-btn" class="copy-btn" aria-label="Copy hotline number to clipboard">Copy</button>
            </div>
        </div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('copy-btn'), link = document.querySelector('.hotline-link');
            if (!btn || !link || !navigator.clipboard) { if (btn) btn.style.display = 'none'; return; }
            const phone = link.getAttribute('href').replace('tel:', ''), origText = btn.textContent, origLabel = btn.getAttribute('aria-label');
            let timeoutId = null;
            btn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(phone);
                    if (timeoutId) clearTimeout(timeoutId);
                    btn.textContent = 'Copied!';
                    btn.setAttribute('aria-label', 'Phone number copied successfully');
                    btn.classList.add('success');
                    timeoutId = setTimeout(() => {
                        btn.textContent = origText; btn.setAttribute('aria-label', origLabel); btn.classList.remove('success');
                    }, 2000);
                } catch (e) { console.error('Failed to copy', e); }
            });
        });
    </script>
</body>
</html>
