<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; }
        .skip { position: absolute; top: -40px; }
        .skip:focus, .skip:focus-visible { top: 0; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; }
        .contact-card { background: #f8f9fa; padding: 16px; border-radius: 8px; margin-top: 20px; display: flex; align-items: center; gap: 12px; }
        .btn { background: var(--primary); color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: var(--primary-hover); }
        .btn.success { background: var(--success); }
        .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section aria-labelledby="support-heading">
            <h2 id="support-heading">Customer Support</h2>
            <div class="contact-card">
                <span>Hotline: <a id="hotline-link" href="tel:09606700700">09606 700 700</a></span>
                <button id="copy-hotline" class="btn" aria-label="Copy hotline number to clipboard">Copy Hotline</button>
            </div>
        </section>
    </main>
    <script>
        let copyTimeout;
        const copyBtn = document.getElementById('copy-hotline');
        const hotlineLink = document.getElementById('hotline-link');
        if (copyBtn && hotlineLink) {
            copyBtn.addEventListener('click', () => {
                const number = hotlineLink.getAttribute('href').replace('tel:', '');
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(number);
                }
                clearTimeout(copyTimeout);
                copyBtn.textContent = 'Copied!';
                copyBtn.setAttribute('aria-label', 'Hotline number copied to clipboard');
                copyBtn.classList.add('success');
                copyTimeout = setTimeout(() => {
                    copyBtn.textContent = 'Copy Hotline';
                    copyBtn.setAttribute('aria-label', 'Copy hotline number to clipboard');
                    copyBtn.classList.remove('success');
                }, 2000);
            });
        }
    </script>
</body>
</html>
