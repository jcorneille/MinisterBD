<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .skip { position: absolute; top: -40px; transition: top 0.2s; }
        .skip:focus-visible { top: 0; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; flex: 1; }
        .card { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin-top: 24px; display: inline-flex; align-items: center; gap: 12px; }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 4px; font-weight: bold; text-decoration: none; border: 1px solid var(--primary); color: var(--primary); background: transparent; cursor: pointer; transition: all 0.2s; font-size: 14px; }
        .btn:hover { background: var(--primary); color: white; }
        .btn:focus-visible { outline: 2px solid var(--primary-hover); outline-offset: 2px; }
        .btn.success { border-color: var(--success); color: var(--success); }
        .btn.success:hover { background: var(--success); color: white; }
        footer { padding: 20px; text-align: center; border-top: 1px solid #eee; font-size: 14px; color: #666; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <div class="card">
            <span>Official Hotline:</span>
            <a id="h-lnk" href="tel:09606700700" aria-label="Call hotline 0 9 6 0 6 7 0 0 7 0 0" class="btn">09606 700 700</a>
            <button id="c-btn" aria-label="Copy hotline to clipboard" class="btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
                <span id="c-txt">Copy</span>
            </button>
        </div>
    </main>
    <footer>© 2026 Minister Hi-Tech Park Limited</footer>
    <script>
        const b = document.getElementById('c-btn'), l = document.getElementById('h-lnk'), t = document.getElementById('c-txt'); let tm;
        b.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(l.getAttribute('href').replace('tel:', ''));
                if (tm) clearTimeout(tm);
                b.classList.add('success'); t.textContent = 'Copied!'; b.setAttribute('aria-label', 'Hotline copied successfully');
                tm = setTimeout(() => { b.classList.remove('success'); t.textContent = 'Copy'; b.setAttribute('aria-label', 'Copy hotline to clipboard'); }, 2000);
            } catch (e) { console.error(e); }
        });
    </script>
</body>
</html>
