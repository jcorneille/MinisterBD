<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; }
        :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
        .skip { position: absolute; top: -100px; left: 10px; padding: 10px 16px; background: var(--primary); color: #fff; text-decoration: none; border-radius: 0 0 4px 4px; font-weight: bold; z-index: 1000; transition: top 0.2s ease-in-out; }
        .skip:focus, .skip:focus-visible { top: 0; outline: 3px solid #000; outline-offset: 2px; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
    </main>
</body>
</html>
