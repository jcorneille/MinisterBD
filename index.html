<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; }
        body { font-family: sans-serif; margin: 0; }
        a:focus-visible, button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        .skip { position: absolute; top: -100px; left: 10px; background: var(--primary); color: #fff; padding: 8px 12px; transition: top 0.2s ease; z-index: 1000; text-decoration: none; border-radius: 0 0 4px 4px; }
        .skip:focus, .skip:focus-visible { top: 0; }
        main { max-width: 800px; margin: 40px auto; padding: 20px; }
        .contact-info { margin-top: 24px; padding: 16px; background: #f8f9fa; border-radius: 8px; border-left: 4px solid var(--primary); }
        .contact-info a { color: var(--primary); text-decoration: underline; font-weight: 500; }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <section class="contact-info" aria-label="Customer Support Contact Information">
            <h2>Customer Support</h2>
            <p>Hotline: <a href="tel:09606700700">09606 700 700</a></p>
            <p>Email: <a href="mailto:info@ministerbd.com">info@ministerbd.com</a></p>
        </section>
    </main>
</body>
</html>
