<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinisterBD</title>
    <style>
        :root { --primary: #0056b3; --primary-hover: #004494; --success: #1e7e34; }
        body { font-family: sans-serif; margin: 0; line-height: 1.5; }
        .skip { position: absolute; top: -100px; transition: top 0.2s; }
        .skip:focus, .skip:focus-visible { top: 0; background: #fff; padding: 8px; z-index: 100; border: 2px solid var(--primary); }
        main { max-width: 800px; margin: 40px auto; padding: 20px; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 20px; display: inline-flex; align-items: center; gap: 12px; }
        .btn { background: var(--primary); color: #fff; border: none; border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 0.9rem; }
        .btn:hover { background: var(--primary-hover); }
        .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        .btn.success { background: var(--success); }
    </style>
</head>
<body>
    <a href="#main" class="skip">Skip to content</a>
    <main id="main">
        <h1>Welcome to MinisterBD</h1>
        <p>Developing an accessible experience for Minister Hi-Tech Park.</p>
        <div class="card">
            <span>Customer Hotline: <a id="hotline" href="tel:09606700700">09606 700 700</a></span>
            <button id="copy-btn" class="btn" aria-label="Copy hotline number">Copy</button>
        </div>
    </main>
    <script>
        const btn = document.getElementById("copy-btn");
        let timer;
        btn.addEventListener("click", () => {
            const num = document.getElementById("hotline").innerText;
            navigator.clipboard.writeText(num).then(() => {
                clearTimeout(timer);
                btn.textContent = "Copied!";
                btn.setAttribute("aria-label", "Hotline number copied");
                btn.classList.add("success");
                timer = setTimeout(() => {
                    btn.textContent = "Copy";
                    btn.setAttribute("aria-label", "Copy hotline number");
                    btn.classList.remove("success");
                }, 2000);
            });
        });
    </script>
</body>
</html>
